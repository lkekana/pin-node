name: Build Check

on:
  push:
    # branches: [main]
    paths-ignore:
        - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.19'
      - name: Run GoReleaser Build (Snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean